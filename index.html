<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إلى جَنَى 🤍🌌</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #080b12;
            --card-bg: rgba(19, 24, 33, 0.75);
            --card-hover: rgba(28, 35, 48, 0.85);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent: #cbd5e1;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: 'Tajawal', sans-serif; min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 2.5rem 1.2rem; position: relative; overflow-x: hidden;
        }
        .aurora-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -2;
            background: #080b12; overflow: hidden; pointer-events: none;
        }
        .aurora-light {
            position: absolute; width: 150%; height: 150%; top: -25%; left: -25%;
            background: radial-gradient(circle at 20% 30%, rgba(124, 58, 237, 0.15), transparent 45%), 
                        radial-gradient(circle at 80% 40%, rgba(16, 185, 129, 0.12), transparent 50%), 
                        radial-gradient(circle at 50% 80%, rgba(37, 99, 235, 0.15), transparent 50%);
            filter: blur(60px); animation: auroraDrift 22s ease-in-out infinite alternate;
        }
        @keyframes auroraDrift {
            0% { transform: translate(0, 0) scale(1) rotate(0deg); }
            50% { transform: translate(3%, -2%) scale(1.05) rotate(2deg); }
            100% { transform: translate(-3%, 3%) scale(0.98) rotate(-2deg); }
        }
        .stars-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .star {
            position: absolute; background: #ffffff; border-radius: 50%;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8), 0 0 15px rgba(167, 139, 250, 0.5);
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }
        .container { max-width: 740px; width: 100%; display: flex; flex-direction: column; gap: 2.5rem; }
        .birthday-calendar {
            max-width: 340px; margin: 0 auto; padding: 22px 20px;
            background: var(--card-bg); backdrop-filter: blur(12px);
            border: 1px solid var(--border-color); border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45); text-align: center; direction: ltr;
        }
        .cal-header { margin-bottom: 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.08); padding-bottom: 10px; }
        .cal-month {
            font-size: 1.2rem; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
            background: linear-gradient(90deg, #a78bfa, #34d399, #60a5fa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .cal-year { display: block; font-size: 0.85rem; color: rgba(255, 255, 255, 0.5); letter-spacing: 3px; margin-top: 4px; }
        .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; font-size: 0.85rem; }
        .cal-day-name { color: rgba(255, 255, 255, 0.4); font-size: 0.75rem; padding-bottom: 6px; }
        .cal-date { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; border-radius: 50%; color: rgba(255, 255, 255, 0.75); position: relative; }
        .cal-date.empty { pointer-events: none; }
        .cal-date.highlight-15 {
            color: #ffffff; font-weight: bold;
            background: radial-gradient(circle, rgba(167, 139, 250, 0.35) 0%, rgba(52, 211, 153, 0.2) 100%);
            border: 1.5px solid #a78bfa;
            box-shadow: 0 0 15px rgba(167, 139, 250, 0.7), inset 0 0 8px rgba(52, 211, 153, 0.5);
            animation: sparkle15 2.5s infinite ease-in-out;
        }
        .cal-date.highlight-15::after {
            content: '✨'; position: absolute; top: -10px; right: -8px; font-size: 0.75rem; animation: twinkleStar 1.8s infinite alternate;
        }
        @keyframes sparkle15 {
            0%, 100% { transform: scale(1); box-shadow: 0 0 12px rgba(167, 139, 250, 0.6); }
            50% { transform: scale(1.12); box-shadow: 0 0 20px rgba(52, 211, 153, 0.8); }
        }
        @keyframes twinkleStar { 0% { opacity: 0.4; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }
        .intro-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            padding: 2.8rem 2.2rem; border-radius: 24px; backdrop-filter: blur(16px);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45); text-align: center;
        }
        .symbols-row { display: flex; justify-content: center; gap: 1.2rem; margin-bottom: 1.8rem; font-size: 1.4rem; opacity: 0.85; letter-spacing: 4px; }
        .intro-text { font-family: 'Amiri', serif; font-size: 1.25rem; line-height: 2.5; color: #f8fafc; }
        .section-header { text-align: center; margin-bottom: 0.5rem; }
        .section-title { font-size: 1.7rem; font-family: 'Amiri', serif; color: var(--accent); letter-spacing: 0.5px; }
        .section-sub { font-size: 0.9rem; color: var(--text-muted); margin-top: 0.3rem; }
        .timeline { position: relative; padding-right: 2.2rem; display: flex; flex-direction: column; gap: 2rem; }
        .timeline::before { content: ''; position: absolute; right: 8px; top: 12px; bottom: 12px; width: 2px; background: linear-gradient(180deg, rgba(148,163,184,0.4), rgba(148,163,184,0.1)); }
        .timeline-card {
            background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px;
            padding: 1.8rem 2rem; position: relative; backdrop-filter: blur(12px); box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3);
        }
        .timeline-card::before {
            content: ''; position: absolute; right: -2.2rem; top: 2rem; width: 14px; height: 14px;
            background: #94a3b8; border-radius: 50%; border: 3px solid var(--bg-color); box-shadow: 0 0 10px rgba(148, 163, 184, 0.5);
        }
        .station-tag {
            display: inline-block; font-size: 0.85rem; color: #cbd5e1; background: rgba(255,255,255,0.06);
            padding: 0.25rem 0.85rem; border-radius: 20px; margin-bottom: 0.8rem; border: 1px solid rgba(255,255,255,0.1);
        }
        .card-title { font-size: 1.35rem; font-family: 'Amiri', serif; color: var(--text-main); margin-bottom: 0.8rem; }
        .card-desc { font-size: 1.05rem; line-height: 1.9; color: #cbd5e1; }
        .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border-color), transparent); margin: 0.5rem 0; }
        .memories-grid { display: grid; grid-template-columns: 1fr; gap: 1.6rem; }
        .special-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 1.8rem 2rem; backdrop-filter: blur(12px); }
        .special-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; border-bottom: 1px solid rgba(148, 163, 184, 0.12); padding-bottom: 0.7rem; }
        .special-label { font-family: 'Amiri', serif; font-size: 1.25rem; color: #f8fafc; }
        .memory-img-container { margin-top: 1.2rem; border-radius: 14px; overflow: hidden; border: 1px solid var(--border-color); display: flex; justify-content: center; background: #0a0c0f; }
        .memory-img-container img { width: 100%; height: auto; max-height: 540px; object-fit: contain; }
        .dual-img-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-top: 1.2rem; }
        @media (max-width: 560px) { .dual-img-grid { grid-template-columns: 1fr; } }
          <div class="intro-card">
            <div class="symbols-row"><span>🌊</span><span>🍇</span><span>🍒</span><span>🤍</span><span>✨</span></div>
            <p class="intro-text">
                إِلَى ذَلِكَ الشَّاطِئ الرَّمَادِيّ، الَّذِي زَيَّنتهُ كُرومُ العِنَب، وَمِن عَبَقهِ يَنبَعِثُ عَبيرُ الكَرَزِ في الأَرجاءِ، لِيَقتَحِمَ المَشهَدَ زَبَدُ البَحرِ بِمَوجِهِ المُتَلاطِم، وَبِلَونِهِ الأَبيَضِ كَالحَليب، فَيَنعَكِسُ عَلى زَبَدِهِ نَجمُ المَساء، مُضفِيًا عَلَيهِ بَريقًا يَأسِرُ النَّاظر.<br><br>
                إِلَى هَذِهِ الرُّموزِ الخَمسَةِ الَّتِي عَرَّفتُكِ بِهَا، وَمَيَّزتُكِ فيهَا، عَلى غَرابَتِهَا وَخُصوصِيَّتِها؛ إِلى مَليحَتِي، وَضِياءِ دَرْبِي، وَجَنَّتِي جَنَى. 🤍🌊
            </p>
        </div>

        <div>
            <div class="section-header">
                <h2 class="section-title">الخط الزمني لمحطاتنا</h2>
                <p class="section-sub">البدايات التي صنعت هذا الأثر</p>
            </div>
            <div class="timeline" style="margin-top: 1.8rem;">
                <div class="timeline-card">
                    <span class="station-tag">Oct. 2025</span>
                    <h3 class="card-title">المحطة الأولى</h3>
                    <p class="card-desc">لما ضافتك هناء لقروبنا، مع اعتراف اني كنت بستناكي تزهقي القروب وتطلعي مثل اي بنت إلا انه بعد لحظات كرهت انه فكرت هيك، كان في بيننا شبه كافي لدرجة ناديتك وقتها ب "فهيمة".</p>
                </div>
                <div class="timeline-card">
                    <span class="station-tag">المحطة الثانية</span>
                    <h3 class="card-title">علياء وسجى</h3>
                    <p class="card-desc">حطيتهم مكرهة على ذلك، بس مش لهوشتهم بل لاثرها على علاقتنا، كانت اول هوشة بنتشارك فيها واطولهم ومع ذلك انسجمنا بشكل مثالي وتلاقت افكارنا ووجهات نظرنا بشكل خلاني اشوفك بطريقة ثانية طريقة ما حسستني انك مجرد صديق... شعور مختلف غير عن شعوري مع الباقي.</p>
                </div>
                <div class="timeline-card">
                    <span class="station-tag">المحطة الثالثة</span>
                    <h3 class="card-title">ما بقي من الذكرى</h3>
                    <p class="card-desc">محطاتنا كثيرة، اكثر من اني احطها كلها هون، سنتين مش اشي قليل! بس المحطتين الي قبلهم هم بدايتنا وهم الي وصلونا لهون وصلونا للي احنا فيه وأتمنى من قلبي كله تكثر محطاتنا وما تنقطع اي صداقة بلشتها دايما كنت اشوف نقطة النهاية ببدايتها وارجو ربي اني ما اشوفها بيناتنا.</p>
                </div>
            </div>
        </div>

        <div class="divider"></div>

        <div>
            <div class="section-header">
                <h2 class="section-title">أرشيف ذكرياتنا</h2>
                <p class="section-sub">تفاصيل صغيرة وصور بقيت محفوظة في مهجتي</p>
            </div>
            <div class="memories-grid" style="margin-top: 1.8rem;">
                <div class="special-card">
                    <div class="special-header"><span class="special-label">مسجاتك المحفوظة</span><span>💌</span></div>
                    <p class="card-desc">"مسجاتك عمرها ما غابت عني وقبل ما احفظها بجوالي كنت احفظها بقلبي"</p>
                    <div class="dual-img-grid">
                        <div class="memory-img-container"><img src="album_messages.png" alt="أرشيف المسجات"></div>
                        <div class="memory-img-container"><img src="widad_message.png" alt="قليل من يدوم على الوداد"></div>
                    </div>
                </div>
                <div class="special-card">
                    <div class="special-header"><span class="special-label">رغبتنا الثابتة...</span><span>🧚‍♀️</span></div>
                    <div class="memory-img-container"><img src="nona_101.png" alt="رغبتنا الثابتة"></div>
                </div>
                <div class="special-card">
                    <div class="special-header"><span class="special-label">أول استشارة أدبية</span><span>✒️</span></div>
                    <p class="card-desc">"اول استشارة أدبية منك إلي، هون كانت اول مرة بحس فيها بقيمتي عندك، من اعز مواقفي"</p>
                    <div class="memory-img-container"><img src="tiryaq.png" alt="ترياق"></div>
                </div>
                <div class="special-card">
                    <div class="special-header"><span class="special-label">هون بس كانت بنتي تشجعك >∞<</span><span>🐱</span></div>
                    <div class="memory-img-container"><img src="cat_cheer.png" alt="تشجيع القطة"></div>
                </div>
                <div class="special-card">
                    <div class="special-header"><span class="special-label">أسعد مكالمة خضتها بحياتي واطولهم</span><span>📞</span></div>
                    <div class="memory-img-container"><img src="long_call.png" alt="أسعد مكالمة"></div>
                </div>
                <div class="special-card">
                    <div class="special-header"><span class="special-label">هاي المسج جدا جدا بتعز علي</span><span>🎀</span></div>
                    <div class="memory-img-container"><img src="precious_message.png" alt="المسج الغالية"></div>
                </div>
                <div class="special-card">
                    <div class="special-header"><span class="special-label">فراولتي 🥹</span><span>🍓</span></div>
                    <div class="memory-img-container"><img src="strawberry.png" alt="فراولتي"></div>
                </div>
            </div>
        </div>
              <div class="music-player-section" id="playerSection">
            <div class="cd-wrapper" onclick="togglePlayMusic()" title="اضغطي لتشغيل الأغنية">
                <div class="cd-disc" id="cdDisc">
                    <div class="cd-center-label"><div class="cd-center-dot"></div></div>
                </div>
                <div class="tonearm"></div>
            </div>
            <div class="song-info">
                <h3>بحبك أنا - محمد رافع</h3>
                <span id="playStatus">اضغطي على الـ CD للتشغيل ونزول الإبرة ✨</span>
            </div>
            <div class="lyrics-box" id="lyricsBox">اضغطي على الـ CD أولاً للتشغيل، ثم انقري على هذا الصندوق لتنقل الأبيات مع المغني بكل انسيابية...</div>
            <audio id="bgMusic" src="your_song.mp3"></audio>
        </div>

        <div class="bottle-finale">
            <div class="bottle-trigger" onclick="openBottle()" title="افتحي الزجاجة">🍾</div>
            <span class="bottle-hint" id="bottleHint">وصلت موجة أخيرة من الشفق.. اضغطي على الزجاجة</span>
            <div class="scroll-message-box" id="finalScroll">
                "وفي الختام، أرجو الله أن يجعل ما تبقى من عمركِ يضج بالسعادة والهناء، وأن يكتب لكِ الرضا في أعمالكِ وفي نفسكِ وأن يرضى عنكِ، وينير دربكِ بالنَّجاح والتَّوفيق📜✨"
            </div>
        </div>

        <div class="final-sig">
            كل عام وأنتِ النور الذي لا ينطفئ، وملاذيَ الدافئ... جنّتي جنى 🤍🌌
        </div>
    </div>

    <style>
        .cd-wrapper {
            position: relative; width: 150px; height: 150px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        .cd-disc {
            width: 140px; height: 140px; border-radius: 50%;
            background: 
                radial-gradient(circle, #111 0%, #111 18%, transparent 19%),
                repeating-radial-gradient(circle, #222, #222 3px, #111 4px, #333 6px),
                linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%, rgba(255,255,255,0.2) 100%);
            border: 2px solid rgba(255,255,255,0.25);
            box-shadow: 0 0 25px rgba(167, 139, 250, 0.4), inset 0 0 15px rgba(0,0,0,0.8);
            display: flex; align-items: center; justify-content: center; position: relative;
            transition: transform 0.3s ease;
        }
        .cd-center-label {
            width: 50px; height: 50px; background: radial-gradient(circle, #a78bfa 0%, #4c1d95 100%);
            border-radius: 50%; border: 2px solid rgba(255,255,255,0.4);
            display: flex; align-items: center; justify-content: center;
        }
        .cd-center-dot { width: 14px; height: 14px; background: #080b12; border-radius: 50%; }
        .cd-disc.rotating { animation: rotateCD 3.5s linear infinite; }
        @keyframes rotateCD { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        .tonearm {
            position: absolute; top: -15px; right: -10px; width: 60px; height: 80px;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 80"><path d="M40 10 C35 30 25 50 15 65" stroke="%23cbd5e1" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="40" cy="10" r="7" fill="%2394a3b8"/><circle cx="15" cy="65" r="5" fill="%23a78bfa"/></svg>');
            background-repeat: no-repeat; transform-origin: top right;
            transform: rotate(-35deg); transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5));
        }
        .music-player-section.playing .tonearm { transform: rotate(0deg); }

        .lyrics-box {
            width: 100%; min-height: 90px; background: rgba(10, 13, 18, 0.6);
            border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 1.2rem;
            font-family: 'Amiri', serif; font-size: 1.2rem; line-height: 2.2; color: #e2e8f0;
            opacity: 1; filter: blur(0px); cursor: pointer;
            transition: opacity 0.5s ease, filter 0.5s ease, transform 0.5s ease;
        }
        .lyrics-box.fade-out { opacity: 0; filter: blur(8px); transform: translateY(6px); }
    </style>

    <script>
        const container = document.getElementById('starsContainer');
        for (let i = 0; i < 30; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.top = Math.random() * 100 + '%';
            star.style.left = Math.random() * 100 + '%';
            const size = Math.random() * 3 + 1.5 + 'px';
            star.style.width = size; star.style.height = size;
            star.style.setProperty('--duration', (Math.random() * 2 + 1.5) + 's');
            star.style.animationDelay = (Math.random() * 2) + 's';
            container.appendChild(star);
        }

        // الكلمات مرتبة بدقة مع التكرار لتتنقلي بينها بنقرة ناعمة
        const lyricsData = [
            "🎶 (موسيقى هادئة تلامس الروح)...",
            "فجأة لقيت روحي معك..",
            "تركض لعندك لعندك إلك..",
            "فجأة لقيت روحي معك..",
            "تركض لعندك لعندك إلك..",
            "لَسألني قلبي شو بدك إنت؟",
            "أخدني أخدني لحضنك إلك..",
            "بحبك أنا..",
            "عايش إلك كل يوم بيوم..",
            "أحلى دني وحتى النوم..",
            "حدك بكون براقب عيون..",
            "بسهر عليهن وكلشي بهون..",
            "🤍✨"
        ];

        let currentLyricIndex = 0;
        const music = document.getElementById('bgMusic');
        const cdDisc = document.getElementById('cdDisc');
        const playerSection = document.getElementById('playerSection');
        const playStatus = document.getElementById('playStatus');
        const lyricsBox = document.getElementById('lyricsBox');

        function advanceLyrics() {
            if (music.paused) return;
            lyricsBox.classList.add('fade-out');
            setTimeout(() => {
                currentLyricIndex = (currentLyricIndex + 1) % lyricsData.length;
                lyricsBox.textContent = lyricsData[currentLyricIndex];
                lyricsBox.classList.remove('fade-out');
            }, 250);
        }

        lyricsBox.addEventListener('click', advanceLyrics);

        function togglePlayMusic() {
            if (music.paused) {
                music.play();
                cdDisc.classList.add('rotating');
                playerSection.classList.add('playing');
                playStatus.textContent = "جاري العزف.. (انقري على صندوق الكلمات لتنتقل الأبيات مع صوت المغني بضبابية ناعمة) 🤍";
                lyricsBox.textContent = lyricsData[currentLyricIndex];
            } else {
                music.pause();
                cdDisc.classList.remove('rotating');
                playerSection.classList.remove('playing');
                playStatus.textContent = "تم الإيقاف المؤقت (اضغطي للمتابعة)";
            }
        }

        music.addEventListener('ended', () => {
            cdDisc.classList.remove('rotating');
            playerSection.classList.remove('playing');
            playStatus.textContent = "انتهى المقطع.. اضغطي لإعادته ✨";
            currentLyricIndex = 0;
        });

        function openBottle() {
            const scrollBox = document.getElementById('finalScroll');
            const hint = document.getElementById('bottleHint');
            scrollBox.classList.add('revealed');
            hint.textContent = "رسالة من أعماق الشفق والنجوم ✨";
        }
    </script>
</body>
</html>
